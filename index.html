<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signature Love ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- MUSIC -->
<audio id="bgMusic" src="music.mp3" autoplay loop></audio>

<!-- SLIDER SECTION -->
<section id="sliderSection" class="section active">
  <h1 class="title">For <span id="girlName">Anjali ❤️</span></h1>
  <div class="slider">
  <img id="slideImg" class="fade-img" src="img1.jpg">
</div>
</section>

<!-- VALENTINE QUESTION -->
<section id="valentineSection" class="section">
  <h2 id="questionText">Will you be my Valentine? 💖</h2>

  <div class="buttons">
    <button id="yesBtn">Yes ❤️</button>
    <button id="noBtn">No 🙈</button>
  </div>
</section>

<!-- FINAL MESSAGE -->
<section id="finalSection" class="section">
  <div class="finalBox">
    <h2>💖 I knew you would say YES 💖</h2>
    <p>You just made this moment unforgettable 🥹❤️</p>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
